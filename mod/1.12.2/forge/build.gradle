plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.1'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

def commonJar = rootProject.ext.commonJar
def standaloneCommonBuild = gradle.includedBuilds.find { it.name == 'common' }
def commonJarFiles = files(commonJar)
if (standaloneCommonBuild != null) {
    commonJarFiles.builtBy(standaloneCommonBuild.task(':jar'))
}

sourceSets {
    main {
        java.srcDir(rootProject.file('runtime/src/main/kotlin'))
    }
}

configurations.create('embeddedCommon')

archivesBaseName = 'BlackBoxPro-forge-1.12.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'

    extraRunJvmArguments.addAll('-ea:com.blackboxpro')
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly commonJarFiles
    embeddedCommon commonJarFiles
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlin_version}"
    implementation "com.google.code.gson:gson:2.8.9"
}

compileKotlin {
    if (standaloneCommonBuild != null) {
        dependsOn standaloneCommonBuild.task(':jar')
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs = ['-Xjvm-default=all']
    }
}

compileJava {
    if (standaloneCommonBuild != null) {
        dependsOn standaloneCommonBuild.task(':jar')
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
}

jar {
    if (standaloneCommonBuild != null) {
        dependsOn standaloneCommonBuild.task(':jar')
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embeddedCommon.collect { zipTree(it) }
    }
    from {
        configurations.runtimeClasspath.findAll { it.name.startsWith('kotlin-') }.collect { zipTree(it) }
    }
}
