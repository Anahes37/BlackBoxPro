name: Build & Release

on:
  push:
    branches: [main, dev-2.0]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup JDK 8 (for 1.12.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      # actions/setup-java 最后安装的版本会成为默认 JAVA_HOME
      # 需要把 JDK 21 设回默认，1.12.2 通过 Gradle toolchain 自动选择 JDK 8
      - name: Set JDK 21 as default
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle-user-home-root
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: |
          chmod +x gradlew
          chmod +x mod/1.12.2/gradlew
          chmod +x plugin/gradlew

      - name: Remove local proxy settings
        run: |
          sed -i '/systemProp\.http\.proxy/d' gradle.properties
          sed -i '/systemProp\.https\.proxy/d' gradle.properties
          sed -i '/systemProp\.java\.net\.useSystemProxies/d' gradle.properties
          sed -i '/systemProp\.http\.nonProxyHosts/d' gradle.properties
          sed -i '/systemProp\.https\.nonProxyHosts/d' gradle.properties

      - name: Read version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build 1.21.11 Mod (Fabric + NeoForge)
        run: ./gradlew mod2111_build --no-daemon

      - name: Build 1.21.1 Mod (Fabric + NeoForge)
        run: |
          cd mod
          ../gradlew --no-daemon :1.21.1:runtime:build :1.21.1:fabric:build
          cd ..
          # Pack NeoForge 1.21.1
          ./gradlew mod1211_pack_neoforge --no-daemon

      - name: Build 1.12.2 Mod (Forge)
        run: ./gradlew forge1122_build --no-daemon

      - name: Build Plugin
        run: ./gradlew plugin_build --no-daemon

      - name: Collect jars
        run: ./gradlew collectJars --no-daemon

      - name: List artifacts
        run: ls -la build/libs/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlackBoxPro-${{ steps.version.outputs.version }}
          path: build/libs/*.jar

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-2.0'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: BlackBoxPro-${{ steps.version.outputs.version }}
          path: artifacts/

      - name: Determine tag
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${{ github.ref }}" = "refs/heads/dev-2.0" ]; then
            TAG="v${VERSION}-dev"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=${{ github.ref == 'refs/heads/dev-2.0' }}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: BlackBoxPro ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
