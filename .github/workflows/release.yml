name: Release

on:
  push:
    branches: [main]
    paths:
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: check
        run: |
          version=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          old_version=$(git show HEAD~1:gradle.properties 2>/dev/null | grep '^version=' | cut -d'=' -f2 | tr -d '[:space:]' || echo "")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$old_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $old_version -> $version"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric & NeoForge
        run: ./gradlew :fabric-1.21.11:build :neoforge-1.21.11:build

      - name: Build Forge 1.12.2
        run: cd forge-1.12.2 && ./gradlew build

      - name: Build Plugin
        run: cd plugin && ./gradlew jar

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          ver="${{ needs.check-version.outputs.version }}"
          cp fabric-1.21.11/build/libs/BlackBoxPro-fabric-1.21.11-${ver}.jar release-artifacts/
          cp neoforge-1.21.11/build/libs/BlackBoxPro-neoforge-1.21.11-${ver}.jar release-artifacts/
          cp forge-1.12.2/build/libs/BlackBoxPro-forge-1.12.2-${ver}.jar release-artifacts/
          cp plugin/build/libs/BlackBoxPro-Plugin-${ver}.jar release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          body: |
            ## v${{ needs.check-version.outputs.version }}

            ### Artifacts
            - BlackBoxPro-fabric-1.21.11-${{ needs.check-version.outputs.version }}.jar
            - BlackBoxPro-neoforge-1.21.11-${{ needs.check-version.outputs.version }}.jar
            - BlackBoxPro-forge-1.12.2-${{ needs.check-version.outputs.version }}.jar
            - BlackBoxPro-Plugin-${{ needs.check-version.outputs.version }}.jar
          files: release-artifacts/*.jar
